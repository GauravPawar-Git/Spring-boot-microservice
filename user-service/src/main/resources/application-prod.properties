# ---- prod profile: PostgreSQL. Secrets come from environment variables, never from this file ----
# ${NAME:default} = use env var NAME, or the default after ':' if it is not set
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/firstproject}
spring.datasource.username=${DB_USERNAME:postgres}
# no default: the app refuses to start without a password
spring.datasource.password=${DB_PASSWORD}

# connection pool (HikariCP is Spring Boot's default)
spring.datasource.hikari.maximum-pool-size=10

spring.h2.console.enabled=false

# JWT signing key: no default, so prod refuses to start without the JWT_SECRET environment variable
app.jwt.secret=${JWT_SECRET}
# browser apps allowed to call the API (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://example.com}
