# ---- dev profile: in-memory H2, verbose SQL so you can watch what Hibernate does ----
spring.datasource.url=jdbc:h2:mem:testdb
spring.h2.console.enabled=true

# Print every SQL statement Hibernate sends: count the SELECTs to spot an N+1 problem
logging.level.org.hibernate.SQL=debug

