spring.application.name=discovery-server
server.port=8761

# This IS the registry: don't register with itself or fetch a registry from elsewhere
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Local learning setup: evict dead instances quickly and don't hold on to them
# (self-preservation exists to survive network partitions in production)
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000
