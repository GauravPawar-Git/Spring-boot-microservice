spring.application.name=config-server
server.port=8888

# "native" = read plain files from disk instead of a Git repository.
# Two locations so it works whether started from the repo root (java -jar) or from config-server/ (mvnw spring-boot:run).
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=${CONFIG_REPO:file:./config-repo/,file:../config-repo/}

management.endpoints.web.exposure.include=health
