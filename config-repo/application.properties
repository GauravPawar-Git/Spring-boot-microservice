# Shared by EVERY service that uses the config server (lowest priority: a service's own file below overrides it)

# Tracing: record every request (1.0 = 100%). Production often samples 0.1 or less to save cost.
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
