# ---- Shared by every profile ----
# Phase 5: the name other services use to find this one in Eureka (lb://user-service)
spring.application.name=user-service

# Profile used when none is given (-Dspring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod overrides it)
spring.profiles.default=dev

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate

# Close the DB session when the @Transactional service method ends, not after the JSON is written.
# Lazy-loading outside a transaction then fails fast instead of silently running extra queries.
spring.jpa.open-in-view=false

# debug prints thousands of lines; switch back only when investigating Spring itself
logging.level.org.springframework=info
management.endpoints.web.exposure.include=health

# ---- JWT (Phase 3) ----
# How long a login token stays valid (Duration format: 1h, 30m, 15s)
app.jwt.expiration=1h

# ---- Service discovery (Phase 5) ----
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
# register the IP, not the Windows machine name, so other services can always reach us
eureka.instance.prefer-ip-address=true
