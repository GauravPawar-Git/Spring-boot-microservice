# ---- Shared by every profile ----
# Phase 5: the name other services use to find this one in Eureka (lb://user-service)
spring.application.name=user-service

# Profile used when none is given (-Dspring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod overrides it)
spring.profiles.default=dev

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate

# Close the DB session when the @Transactional service method ends, not after the JSON is written.
# Lazy-loading outside a transaction then fails fast instead of silently running extra queries.
spring.jpa.open-in-view=false

# debug prints thousands of lines; switch back only when investigating Spring itself
logging.level.org.springframework=info
management.endpoints.web.exposure.include=health,prometheus

# ---- JWT (Phase 3) ----
# How long a login token stays valid (Duration format: 1h, 30m, 15s)
app.jwt.expiration=1h

# ---- Service discovery (Phase 5) ----
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
# register the IP, not the Windows machine name, so other services can always reach us
eureka.instance.prefer-ip-address=true

# ---- Phase 6 ----
# Central configuration (shared tracing settings live in config-repo/application.properties)
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# Cache GET /jpa/posts/{id}: at most 500 posts, each for 60 s (Caffeine = in-memory, per instance)
spring.cache.cache-names=posts
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=60s

# Kafka: publish "posts-deleted" events. Off by default because no broker runs on this machine.
app.events.enabled=${EVENTS_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
