spring.application.name=api-gateway
server.port=8765

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# ---- Routes: first matching predicate wins ----
# Users, posts and login live in user-service
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**,/jpa/**
# If user-service is down or unreachable, answer from FallbackController (503 JSON) instead of a 500
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.name=user-service
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.fallbackUri=forward:/fallback/user-service

# Comments live in comment-service
spring.cloud.gateway.server.webflux.routes[1].id=comment-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://comment-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/comments/**
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.name=comment-service
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.fallbackUri=forward:/fallback/comment-service

# Applied to every route: lets each service's logs show the request came through the gateway
spring.cloud.gateway.server.webflux.default-filters[0]=AddRequestHeader=X-Gateway, api-gateway

# The circuit breaker's time limiter defaults to 1 s, which would cut off slow-but-healthy calls
# (a cold JVM, BCrypt at login). 10 s is the "really stuck" threshold.
resilience4j.timelimiter.configs.default.timeout-duration=10s
# Open the breaker after 3 calls with >= 50% failures (the default needs 100 calls), so a dead service
# gets instant 503s instead of every caller waiting for a connection attempt. Re-try after 10 s.
resilience4j.circuitbreaker.configs.default.sliding-window-size=5
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=3
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
# Give up connecting to an instance after 1 s (milliseconds)
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=1000

# Expose the gateway's route table at /actuator/gateway/routes (handy for learning; don't expose in prod)
management.endpoints.web.exposure.include=health,gateway
management.endpoint.gateway.access=read-only

# ---- Phase 6: shared settings (tracing) come from the config server ----
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
