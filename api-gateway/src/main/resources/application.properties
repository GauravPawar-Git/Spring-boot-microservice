spring.application.name=api-gateway
server.port=8765

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# ---- Routes: first matching predicate wins ----
# Users, posts and login live in user-service
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**,/jpa/**

# Comments live in comment-service
spring.cloud.gateway.server.webflux.routes[1].id=comment-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://comment-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/comments/**

# Applied to every route: lets each service's logs show the request came through the gateway
spring.cloud.gateway.server.webflux.default-filters[0]=AddRequestHeader=X-Gateway, api-gateway

# Expose the gateway's route table at /actuator/gateway/routes (handy for learning; don't expose in prod)
management.endpoints.web.exposure.include=health,gateway
management.endpoint.gateway.access=read-only

# ---- Phase 6: shared settings (tracing) come from the config server ----
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
