# Runs on every push to main and every pull request.
# 1. build-and-test: each Maven project is built and tested in parallel (a matrix)
# 2. docker-smoke-test: builds the user-service image and runs it with PostgreSQL via docker compose
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Test ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false            # one failing service shouldn't hide the others' results
      matrix:
        project: [user-service, comment-service, discovery-server, api-gateway, config-server]
        include:
          - project: user-service
            dir: .
          - project: comment-service
            dir: comment-service
          - project: discovery-server
            dir: discovery-server
          - project: api-gateway
            dir: api-gateway
          - project: config-server
            dir: config-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven              # reuse ~/.m2 between runs: much faster builds

      - name: Build and test
        run: ./mvnw -B -f ${{ matrix.dir }}/pom.xml verify

      - name: Keep test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.project }}
          path: ${{ matrix.dir }}/target/surefire-reports/

  docker-smoke-test:
    name: Docker image + compose smoke test
    needs: build-and-test         # only if every project's tests passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env with throwaway secrets
        run: |
          echo "DB_PASSWORD=$(openssl rand -hex 16)" >> .env
          echo "JWT_SECRET=$(openssl rand -base64 32)" >> .env

      - name: Build image and start app + PostgreSQL
        run: docker compose up -d --build --wait

      - name: Wait for the app to be healthy
        run: |
          for i in $(seq 1 30); do
            curl -sf localhost:8080/actuator/health && exit 0
            sleep 3
          done
          docker compose logs app
          exit 1

      - name: Log in with a seeded user and read data from PostgreSQL
        run: |
          TOKEN=$(curl -sf -H 'Content-Type: application/json' \
            -d '{"username":"rambo","password":"password123"}' localhost:8080/auth/login | jq -r .accessToken)
          curl -sf -H "Authorization: Bearer $TOKEN" localhost:8080/auth/me
          curl -sf localhost:8080/jpa/posts | jq length

      - name: Show image size and layers
        run: |
          docker images first-project
          docker history first-project:latest --format '{{.Size}}\t{{.CreatedBy}}' | head -8

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v
