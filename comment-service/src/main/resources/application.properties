spring.application.name=comment-service
server.port=8082

# ---- Own database (separate from user-service's) ----
# H2 by default (local runs, tests); docker-compose sets DB_URL to its own PostgreSQL (database per service)
spring.datasource.url=${DB_URL:jdbc:h2:mem:comments}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---- Service discovery ----
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
# /actuator/refresh would otherwise re-create the Eureka client, which failed with an NPE (Spring Cloud 2025.1.3)
eureka.client.refresh.enable=false

# ---- JWT: same signing key as user-service, so tokens issued there are trusted here ----
# DEV ONLY default; set JWT_SECRET in any real environment
app.jwt.secret=${JWT_SECRET:fOdhuXCFjqBH0/XJj72/vvAFRr11A622jbndlv8cSu8=}

# ---- Calls to user-service: fail fast instead of hanging ----
spring.cloud.openfeign.client.config.user-service.connect-timeout=1000
spring.cloud.openfeign.client.config.user-service.read-timeout=2000

# ---- Circuit breaker "user-service" ----
# look at the last 5 calls; once at least 3 were made and >= 50% failed, OPEN the circuit
resilience4j.circuitbreaker.instances.user-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.user-service.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.user-service.failure-rate-threshold=50
# while OPEN, calls fail immediately (no network call) for 10 s, then 2 trial calls are let through (HALF_OPEN)
resilience4j.circuitbreaker.instances.user-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.user-service.permitted-number-of-calls-in-half-open-state=2
resilience4j.timelimiter.instances.user-service.timeout-duration=3s


# ---- Phase 6 ----
# Central configuration: values from the config server override this file. "optional:" = still start without it.
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
# local fallback; the config server's comment-service.properties replaces it
app.comments.banned-words=spam

# refresh: reload config without restart (admin only), prometheus: metrics for scraping
management.endpoints.web.exposure.include=health,refresh,prometheus

# Kafka: consume "posts-deleted" events. Off by default because no broker runs on this machine.
app.events.enabled=${EVENTS_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=comment-service
spring.kafka.consumer.auto-offset-reset=earliest
