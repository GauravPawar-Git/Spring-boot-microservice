# Passwords and the JWT signing key. Values come from --set at install time; "required" stops the
# install with a clear message if one is missing. Secrets are base64-encoded, NOT encrypted:
# protect them with RBAC, encryption at rest, or an external store (Vault, Sealed Secrets).
apiVersion: v1
kind: Secret
metadata:
  name: microservices-secrets
  labels:
    {{- include "ms.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USERNAME: {{ .Values.secrets.dbUsername | quote }}
  DB_PASSWORD: {{ required "set secrets.dbPassword" .Values.secrets.dbPassword | quote }}
  JWT_SECRET: {{ required "set secrets.jwtSecret" .Values.secrets.jwtSecret | quote }}
