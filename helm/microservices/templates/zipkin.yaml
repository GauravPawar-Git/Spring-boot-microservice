apiVersion: v1
kind: Service
metadata:
  name: zipkin
  labels:
    {{- include "ms.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "ms.selector" "zipkin" | nindent 4 }}
  ports:
    - name: http
      port: 9411
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  labels:
    {{- include "ms.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ms.selector" "zipkin" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ms.selector" "zipkin" | nindent 8 }}
    spec:
      containers:
        - name: zipkin
          image: {{ .Values.zipkin.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 9411
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
